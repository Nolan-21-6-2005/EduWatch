<div class="pie-card">
    <h4 class="pie-title">
        Phân loại vi phạm
    </h4>
    <div class="pie-chart">
        <div class="pie-ring" role="img" aria-label="Biểu đồ phân loại vi phạm"
             style="background: conic-gradient({{GRADIENT}});"></div>
        <!-- Nội dung giữa biểu đồ -->
        <div class="pie-center">
            <span class="pie-total">
                {{TOTAL}}
            </span>
            <span class="pie-caption">
                CA VI PHẠM
            </span>
        </div>
    </div>
    <!-- Chú thích -->
    <div class="pie-legend">
        {{LEGEND}}
    </div>
</div>
